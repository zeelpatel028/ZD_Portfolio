<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ZD Portfolio</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='images/ZD.png') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--vscode-editor-bg);
      min-height: 100vh;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }
    .login-card {
      background-color: var(--vscode-card-bg);
      border: 1px solid var(--vscode-border);
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
    }
    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-peach);
    }
    .login-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="{{ url_for('static', path='images/ZD.png') }}" alt="ZD Logo" class="login-logo">
        <h1 class="login-title">ZD Portfolio Admin</h1>
        <p class="login-subtitle">Secure Developer Command Dashboard</p>
      </div>

      {% if expired %}
        <div class="admin-alert admin-alert-error">
          <i class="fa-solid fa-clock-rotate-left"></i> Session expired. Please log in again.
        </div>
      {% endif %}

      {% if error %}
        <div class="admin-alert admin-alert-error">
          <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <input type="hidden" name="next_url" value="{{ next_url }}">
        
        <div class="admin-form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Admin Email Address</label>
          <input type="email" id="email" name="email" class="admin-input" placeholder="admin@example.com" value="{{ email or '' }}" required autofocus>
        </div>

        <div class="admin-form-group">
          <label for="password"><i class="fa-solid fa-key"></i> Master Password</label>
          <input type="password" id="password" name="password" class="admin-input" placeholder="••••••••••••" required>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; padding: 10px;">
            <i class="fa-solid fa-shield-halved"></i> Continue to 2FA Verification
          </button>
        </div>
      </form>

      <div style="margin-top: 20px; text-align: center; font-size: 11px; color: var(--text-muted);">
        <span>Protected by Argon2id & Single-Use Email OTP</span>
      </div>
    </div>
  </div>
</body>
</html>
