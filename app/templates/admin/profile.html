{% extends "admin/base.html" %}

{% block admin_content %}
<div class="admin-header-row">
  <div>
    <h1>Profile & Bio Management</h1>
    <p style="font-size: 12px; color: var(--text-muted);">Edit public portfolio profile information, contact links, photos, and assets</p>
  </div>
</div>

<form action="/admin/profile" method="POST" enctype="multipart/form-data">
  <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
    
    <!-- LEFT COLUMN: TEXT FIELDS -->
    <div class="admin-card">
      <div class="admin-card-header">
        <div class="admin-card-title"><i class="fa-solid fa-id-card"></i> Personal Information</div>
      </div>

      <div class="admin-form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="admin-input" value="{{ profile.name if profile else '' }}" required>
      </div>

      <div class="admin-form-group">
        <label for="title">Professional Headline / Title</label>
        <input type="text" id="title" name="title" class="admin-input" value="{{ profile.title if profile else '' }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="admin-form-group">
          <label for="email">Contact Email</label>
          <input type="email" id="email" name="email" class="admin-input" value="{{ profile.email if profile else '' }}" required>
        </div>

        <div class="admin-form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" class="admin-input" value="{{ profile.phone if profile else '' }}">
        </div>
      </div>

      <div class="admin-form-group">
        <label for="location">Location / City</label>
        <input type="text" id="location" name="location" class="admin-input" value="{{ profile.location if profile else '' }}">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="admin-form-group">
          <label for="github">GitHub Profile URL</label>
          <input type="url" id="github" name="github" class="admin-input" value="{{ profile.github if profile else '' }}">
        </div>

        <div class="admin-form-group">
          <label for="linkedin">LinkedIn Profile URL</label>
          <input type="url" id="linkedin" name="linkedin" class="admin-input" value="{{ profile.linkedin if profile else '' }}">
        </div>
      </div>

      <div class="admin-form-group">
        <label for="summary">Short Biography / Summary</label>
        <textarea id="summary" name="summary" class="admin-textarea" required>{{ profile.summary if profile else '' }}</textarea>
      </div>

      <button type="submit" class="admin-btn admin-btn-primary" style="padding: 10px 20px;">
        <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
      </button>
    </div>

    <!-- RIGHT COLUMN: MEDIA ASSETS & PREVIEWS -->
    <div>
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title"><i class="fa-solid fa-image"></i> Profile Photo</div>
        </div>
        <div style="text-align: center; margin-bottom: 12px;">
          <img id="photo-preview" src="{{ profile.photo_url if profile else url_for('static', path='images/ZD_Photo.png') }}" alt="Profile Photo" style="max-width: 140px; border-radius: 8px; border: 1px solid var(--vscode-border);">
        </div>
        <div class="admin-form-group">
          <label for="photo">Upload Replacement Photo (Max 5MB)</label>
          <input type="file" id="photo" name="photo" accept="image/*" class="admin-input" data-preview-target="photo-preview">
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title"><i class="fa-solid fa-robot"></i> Cyber Avatar / Character</div>
        </div>
        <div style="text-align: center; margin-bottom: 12px;">
          <img id="avatar-preview" src="{{ profile.avatar_url if profile else url_for('static', path='images/ZD_Chereter.png') }}" alt="Avatar" style="max-width: 140px; border-radius: 8px; border: 1px solid var(--vscode-border);">
        </div>
        <div class="admin-form-group">
          <label for="avatar">Upload Replacement Avatar (Max 5MB)</label>
          <input type="file" id="avatar" name="avatar" accept="image/*" class="admin-input" data-preview-target="avatar-preview">
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title"><i class="fa-solid fa-shield"></i> Brand Logo</div>
        </div>
        <div style="text-align: center; margin-bottom: 12px;">
          <img id="logo-preview" src="{{ profile.logo_url if profile else url_for('static', path='images/ZD.png') }}" alt="Logo" style="max-width: 64px; border-radius: 4px;">
        </div>
        <div class="admin-form-group">
          <label for="logo">Upload Replacement Logo (Max 5MB)</label>
          <input type="file" id="logo" name="logo" accept="image/*" class="admin-input" data-preview-target="logo-preview">
        </div>
      </div>

    </div>

  </div>
</form>
{% endblock %}
